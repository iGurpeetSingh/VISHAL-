<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VISHAL FX — Official Trading Hub</title>
    <meta name="description" content="Official VISHAL FX trading social hub — Follow media accounts and join the Telegram channel for free signals and updates." />
    <meta property="og:title" content="VISHAL FX — Official Trading Hub" />
    <meta property="og:description" content="Official VISHAL FX trading social hub — Follow media accounts and join the Telegram channel for free signals and updates." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --font-display: 'Orbitron', sans-serif;
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        min-height: 100dvh;
        font-family: var(--font-sans);
        background-color: #02040b;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* Main Viewport Wrapper */
      .page-wrapper {
        position: relative;
        min-height: 100dvh;
        width: 100%;
        background-color: #02040b;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Subtle Desktop/Tablet Dark Ambient Backdrop */
      .ambient-backdrop-img {
        pointer-events: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0.2;
        filter: blur(48px);
        transform: scale(1.1);
        display: none;
      }

      .ambient-backdrop-scrim {
        pointer-events: none;
        position: fixed;
        inset: 0;
        background-color: rgba(2, 4, 11, 0.85);
        display: none;
      }

      /* Responsive 9:16 Poster Stage */
      .poster-stage {
        container-type: inline-size;
        position: relative;
        width: 100%;
        max-width: 100vw;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        background-color: #02040b;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      }

      @media (min-width: 640px) {
        .ambient-backdrop-img,
        .ambient-backdrop-scrim {
          display: block;
        }

        .poster-stage {
          width: auto;
          height: min(96dvh, 980px);
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
      }

      /* Layer 1: Background Image (Image 2) */
      .bg-artwork {
        pointer-events: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        filter: brightness(0.68) contrast(1.06) saturate(0.82);
        z-index: 0;
      }

      /* Dark Calming Scrim Behind Profile Photo */
      .bg-scrim {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(circle at 50% 35.5%, rgba(2, 4, 12, 0.76) 0%, rgba(2, 4, 12, 0.45) 30%, rgba(2, 4, 12, 0.15) 58%, rgba(2, 4, 12, 0.45) 100%),
          linear-gradient(180deg, rgba(2, 4, 11, 0.35) 0%, rgba(2, 4, 11, 0.1) 25%, rgba(2, 4, 11, 0.3) 65%, rgba(2, 4, 11, 0.55) 100%);
      }

      /* Optical Flares Overlay */
      .flare-svg {
        pointer-events: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      /* Layer 2: Circular Profile Container with Subtle Neon Rim Glow */
      .profile-circle-neon {
        pointer-events: none;
        position: absolute;
        top: 23.8%;
        left: 50%;
        transform: translateX(-50%);
        width: 42.5%;
        aspect-ratio: 1 / 1;
        border-radius: 9999px;
        overflow: hidden;
        z-index: 10;
        background:
          linear-gradient(#040816, #040816) padding-box,
          linear-gradient(135deg, rgba(0, 229, 255, 0.85) 0%, rgba(59, 130, 246, 0.75) 50%, rgba(168, 85, 247, 0.85) 100%) border-box;
        border: max(2px, 0.45cqw) solid transparent;
        box-shadow:
          0 0 14px rgba(0, 210, 255, 0.26),
          0 0 28px rgba(139, 92, 246, 0.18),
          inset 0 0 8px rgba(0, 210, 255, 0.15);
      }

      /* Layer 3: Profile Image <img> */
      .profile-img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 15%;
        border-radius: 9999px;
      }

      .profile-rim-inner {
        pointer-events: none;
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        box-shadow:
          inset 0 0 10px rgba(0, 210, 255, 0.22),
          inset 0 0 18px rgba(139, 92, 246, 0.16);
      }

      /* Layer 4: Typography */
      .title-top-wrap {
        pointer-events: none;
        position: absolute;
        top: 10.6%;
        left: 50%;
        transform: translateX(-50%);
        width: 92%;
        text-align: center;
        z-index: 10;
      }

      .title-top {
        font-family: var(--font-display);
        font-size: 8.8cqw;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .title-middle-wrap {
        pointer-events: none;
        position: absolute;
        top: 49.6%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        text-align: center;
        z-index: 10;
      }

      .title-middle {
        font-family: var(--font-display);
        font-size: 9.8cqw;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.035em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .text-vishal-metallic {
        background: linear-gradient(180deg, #FFFFFF 0%, #F4F7FF 50%, #B8C9E8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.75));
      }

      .text-fx-neon {
        background: linear-gradient(135deg, #00E5FF 0%, #2979FF 45%, #A855F7 78%, #EC4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.28)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.75));
      }

      .subtitle-wrap {
        pointer-events: none;
        position: absolute;
        top: 58.4%;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        text-align: center;
        z-index: 10;
      }

      .subtitle-text {
        font-family: var(--font-sans);
        font-size: 3.65cqw;
        font-weight: 500;
        line-height: 1.44;
        letter-spacing: 0.015em;
        color: #EBF2FF;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      }

      .subtitle-line {
        display: block;
        white-space: nowrap;
      }

      /* Layer 5 & 6: Social Buttons */
      .social-btn {
        position: absolute;
        top: 76.2%;
        width: 43%;
        height: 8.2%;
        border-radius: 2.2cqw;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.8cqw;
        padding: 0 2.2cqw;
        color: #F5F8FF;
        text-decoration: none;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-neon-instagram {
        left: 5.5%;
        background:
          linear-gradient(160deg, rgba(16, 10, 30, 0.78) 0%, rgba(8, 6, 20, 0.88) 100%) padding-box,
          linear-gradient(135deg, rgba(236, 72, 153, 0.8) 0%, rgba(168, 85, 247, 0.65) 60%, rgba(0, 210, 255, 0.5) 100%) border-box;
        border: max(1.25px, 0.32cqw) solid transparent;
        box-shadow:
          0 0 12px rgba(236, 72, 153, 0.2),
          0 4px 14px rgba(0, 0, 0, 0.5),
          inset 0 1px 6px rgba(236, 72, 153, 0.15);
      }

      .btn-neon-instagram:hover {
        transform: translateY(-1.5px);
        box-shadow:
          0 0 18px rgba(236, 72, 153, 0.35),
          0 6px 18px rgba(0, 0, 0, 0.6),
          inset 0 1px 10px rgba(236, 72, 153, 0.24);
      }

      .btn-neon-instagram:active {
        transform: translateY(0) scale(0.99);
      }

      .btn-neon-telegram {
        right: 5.5%;
        background:
          linear-gradient(160deg, rgba(8, 16, 34, 0.78) 0%, rgba(5, 9, 22, 0.88) 100%) padding-box,
          linear-gradient(135deg, rgba(0, 229, 255, 0.8) 0%, rgba(59, 130, 246, 0.65) 60%, rgba(147, 51, 234, 0.5) 100%) border-box;
        border: max(1.25px, 0.32cqw) solid transparent;
        box-shadow:
          0 0 12px rgba(0, 229, 255, 0.2),
          0 4px 14px rgba(0, 0, 0, 0.5),
          inset 0 1px 6px rgba(0, 229, 255, 0.15);
      }

      .btn-neon-telegram:hover {
        transform: translateY(-1.5px);
        box-shadow:
          0 0 18px rgba(0, 229, 255, 0.35),
          0 6px 18px rgba(0, 0, 0, 0.6),
          inset 0 1px 10px rgba(0, 229, 255, 0.24);
      }

      .btn-neon-telegram:active {
        transform: translateY(0) scale(0.99);
      }

      .btn-icon-ig {
        width: 4.2cqw;
        height: 4.2cqw;
        flex-shrink: 0;
        color: #f472b6;
      }

      .btn-icon-tg {
        width: 4.2cqw;
        height: 4.2cqw;
        flex-shrink: 0;
        color: #22d3ee;
      }

      .btn-label-ig {
        font-size: 2.8cqw;
        font-weight: 600;
        letter-spacing: 0.025em;
        white-space: nowrap;
      }

      .btn-label-tg {
        font-size: 2.95cqw;
        font-weight: 600;
        letter-spacing: 0.025em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="page-wrapper">
      <!-- Desktop/Tablet Ambient Backdrop -->
      <img
        src="./src/assets/1.png"
        alt=""
        referrerpolicy="no-referrer"
        class="ambient-backdrop-img"
        aria-hidden="true"
      />
      <div class="ambient-backdrop-scrim" aria-hidden="true"></div>

      <!-- ===================================================================
           RESPONSIVE 9:16 POSTER STAGE
           =================================================================== -->
      <div class="poster-stage">
        <!-- LAYER 1: IMAGE 2 — ACTUAL BACKGROUND ARTWORK -->
        <img
          src="./src/assets/1.png"
          alt="VISHAL FX Cyber Trading Background"
          referrerpolicy="no-referrer"
          class="bg-artwork"
        />

        <!-- Dark Navy Calming Scrim -->
        <div class="bg-scrim" aria-hidden="true"></div>

        <!-- Subtle Optical Lens Flares -->
        <svg
          viewBox="0 0 576 1024"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="flare-svg"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="subtleFlareLine" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#00C8FF" stop-opacity="0" />
              <stop offset="28%" stop-color="#0077FF" stop-opacity="0.48" />
              <stop offset="50%" stop-color="#E0F7FF" stop-opacity="0.85" />
              <stop offset="72%" stop-color="#0077FF" stop-opacity="0.48" />
              <stop offset="100%" stop-color="#00C8FF" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="subtleFlareCore" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
              <stop offset="40%" stop-color="#00D2FF" stop-opacity="0.38" />
              <stop offset="100%" stop-color="#0051FF" stop-opacity="0" />
            </radialGradient>
          </defs>

          <ellipse cx="282" cy="170" rx="165" ry="1.8" fill="url(#subtleFlareLine)" />
          <ellipse cx="282" cy="170" rx="38" ry="5.5" fill="url(#subtleFlareCore)" />

          <ellipse cx="288" cy="578" rx="140" ry="1.6" fill="url(#subtleFlareLine)" />
          <ellipse cx="288" cy="578" rx="34" ry="5" fill="url(#subtleFlareCore)" />
        </svg>

        <!-- LAYER 2 & 3: HTML/CSS PROFILE CIRCLE + STATIC PROFILE IMAGE (<img>) -->
        <div class="profile-circle-neon">
          <img
            src="./src//assets/vishal.png"
            alt="Vishal FX Profile"
            referrerpolicy="no-referrer"
            draggable="false"
            class="profile-img"
          />
          <div class="profile-rim-inner" aria-hidden="true"></div>
        </div>

        <!-- LAYER 4: VISHAL FX / VISHAL / SUBTITLE CONTENT -->
        <div class="title-top-wrap">
          <h1 class="title-top">
            <span class="text-vishal-metallic">VISHAL </span>
            <span class="text-fx-neon">FX</span>
          </h1>
        </div>

        <div class="title-middle-wrap">
          <h2 class="title-middle text-vishal-metallic">VISHAL</h2>
        </div>

        <div class="subtitle-wrap">
          <p class="subtitle-text">
            <span class="subtitle-line">Follow Media Account &amp; Telegram</span>
            <span class="subtitle-line">Channel Free Single &amp; Update</span>
          </p>
        </div>

        <!-- LAYER 5: INSTAGRAM HTML BUTTON -->
        <a
          href="https://www.instagram.com/invites/contact/?utm_content=v54z8xk&stkn=1jba8w32x61xo"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn btn-neon-instagram"
          aria-label="Follow on Instagram"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="btn-icon-ig"
            aria-hidden="true"
          >
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
          </svg>
          <span class="btn-label-ig">Follow on Instagram</span>
        </a>

        <!-- LAYER 6: TELEGRAM HTML BUTTON -->
        <a
          href="https://t.me/VishalOfficial02"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn btn-neon-telegram"
          aria-label="Join Telegram"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="btn-icon-tg"
            aria-hidden="true"
          >
            <path d="M21.2 4.4 2.9 11.5c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 10.8-6.8c.5-.3 1-.1.6.2l-8.8 7.9-.3 4.8c.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.2 1.8-.9L23 5.7c.3-1.3-.5-1.9-1.8-1.3z" />
          </svg>
          <span class="btn-label-tg">Join Telegram</span>
        </a>
      </div>
    </main>
  </body>
</html>
